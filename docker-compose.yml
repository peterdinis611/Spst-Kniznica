name: spst

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: spst
      POSTGRES_PASSWORD: spst
      POSTGRES_DB: spst
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spst -d spst']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
