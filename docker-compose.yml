# Local infra: Redis / RabbitMQ / Kafka / PostgreSQL.
#
# Microservice apps (Gateway, Book, Booking, Auth, …) and Next.js are NOT
# containerized here — run them with ./start.sh (or `dotnet run` / `npm run dev`).
#
# Postgres: set Database__Provider=PostgreSql + per-service ConnectionStrings
# (see .env.example / deploy/postgres/). Init script creates one DB per service.
#
# Loopback-only local infra. Defaults are intentionally weak for laptop DX —
# never expose these ports or reuse guest/spst passwords off-machine.
# Production / shared host checklist:
#   - strong POSTGRES_PASSWORD, RABBITMQ_DEFAULT_USER/PASS (no guest)
#   - Kafka SASL/TLS (not PLAINTEXT)
#   - Kafka:/RabbitMq:SigningSecret + RequireSigning=true on services
#   - ASPNETCORE_ENVIRONMENT=Production (Postgres + Redis fail-closed)
services:
  postgres:
    image: postgres:17-alpine
    container_name: spst-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spst}
      # Override in .env for anything beyond a personal laptop.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spst}
      POSTGRES_DB: postgres
    volumes:
      - spst-postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spst} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: spst-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: spst-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      # Loopback-only local defaults — override via env for shared hosts.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    container_name: spst-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # PLAINTEXT is local-only (bound to 127.0.0.1). Use SASL_SSL off-machine.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  spst-postgres-data:
