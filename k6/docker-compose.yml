name: spst-k6

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.3
    depends_on:
      - prometheus
    ports:
      - '3030:3000'
    environment:
      GF_SECURITY_ADMIN_USER: pult
      GF_SECURITY_ADMIN_PASSWORD: pavilonb
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/k6.json
      GF_DATE_FORMATS_INTERVAL_SECOND: s
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  k6:
    image: grafana/k6:2.2.0
    profiles: ['run']
    depends_on:
      - prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:3000}
      TESTID: ${TESTID:-}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(90),p(95),p(99),avg,min,max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ['k6']

volumes:
  prometheus-data:
  grafana-data:
