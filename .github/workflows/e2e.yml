name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  folio:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spst
          POSTGRES_PASSWORD: spst
          POSTGRES_DB: spst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spst -d spst"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://spst:spst@localhost:5432/spst
      SEED_VOLUME: '20'
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      ORIGIN: http://localhost:3000
      BETTER_AUTH_SECRET: ci-folio-e2e-secret-not-for-prod
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run db:migrate
      - run: bun run test:e2e
        env:
          BASE_URL: http://localhost:3000
