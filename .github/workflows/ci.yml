name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      gateway_url:
        description: "Optional running gateway URL for API smoke (e.g. http://127.0.0.1:5200)"
        required: false
        default: ""
      run_load_smoke:
        description: "Run k6 smoke against gateway_url (requires live stack)"
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SpstKniznica.sln

      - name: Build
        run: dotnet build SpstKniznica.sln -c Release --no-restore

      - name: Test
        run: dotnet test SpstKniznica.sln -c Release --no-build --verbosity normal

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  e2e:
    name: E2E smoke (Playwright / Next only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke E2E
        # Next-only: no gateway/microservices in default CI.
        # Full-stack locally: ./scripts/start-all.sh && PLAYWRIGHT_NO_WEB_SERVER=1 PLAYWRIGHT_REQUIRE_GATEWAY=1 npm run test:e2e
        # Or workflow_dispatch with gateway_url → gateway-api-smoke job.
        run: npm run test:e2e -- e2e/smoke.spec.ts e2e/seo-smoke.spec.ts
        env:
          CI: "true"
          PLAYWRIGHT_REQUIRE_GATEWAY: "0"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

  gateway-api-smoke:
    name: Gateway API smoke (manual / external stack)
    if: github.event_name == 'workflow_dispatch' && inputs.gateway_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gateway live + ready
        run: ./scripts/ci-gateway-smoke.sh "${{ inputs.gateway_url }}"

      - name: Gateway metrics endpoint
        run: curl -fsS --max-time 5 "${{ inputs.gateway_url }}/metrics" | head -c 200

  load-smoke:
    name: Load smoke (k6 / manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_load_smoke && inputs.gateway_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: k6 smoke
        env:
          BASE_URL: ${{ inputs.gateway_url }}
          PROFILE: smoke
        run: ./scripts/load-test.sh smoke "${{ inputs.gateway_url }}"

  stack-smoke:
    name: Stack smoke (Book + Booking + Gateway + Redis)
    runs-on: ubuntu-latest
    needs: backend
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        working-directory: src
        run: dotnet build SpstKniznica.sln -c Release

      - name: Start Book / Booking / Gateway
        working-directory: src
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Kafka__Enabled: "false"
          RabbitMq__Enabled: "false"
          Cache__Enabled: "true"
          Cache__ConnectionString: localhost:6379
          Cache__RequireRedis: "false"
          Cache__AllowMemoryFallback: "true"
          RateLimiting__UseRedis: "false"
          InternalApi__SharedKey: spst-dev-internal-key-change-me
          InternalApi__AllowInsecureDefaultKey: "true"
          BookService__HttpEventSync: "true"
          BookService__BaseUrl: http://127.0.0.1:5203
          Services__BookService: http://127.0.0.1:5203
          Services__BookingService: http://127.0.0.1:5208
          Entra__Enabled: "false"
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.run/logs"
          dotnet run --project BookService -c Release --no-build --urls http://127.0.0.1:5203 \
            >"$GITHUB_WORKSPACE/.run/logs/book.log" 2>&1 &
          echo $! >"$GITHUB_WORKSPACE/.run/book.pid"
          dotnet run --project BookingService -c Release --no-build --urls http://127.0.0.1:5208 \
            >"$GITHUB_WORKSPACE/.run/logs/booking.log" 2>&1 &
          echo $! >"$GITHUB_WORKSPACE/.run/booking.pid"
          dotnet run --project GatewayService -c Release --no-build --urls http://127.0.0.1:5200 \
            >"$GITHUB_WORKSPACE/.run/logs/gateway.log" 2>&1 &
          echo $! >"$GITHUB_WORKSPACE/.run/gateway.pid"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5200/health >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:5203/health >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:5208/health >/dev/null 2>&1; then
              echo "services ready"
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for services" >&2
          tail -n 80 "$GITHUB_WORKSPACE/.run/logs/"*.log || true
          exit 1

      - name: Gateway smoke
        run: ./scripts/ci-gateway-smoke.sh http://127.0.0.1:5200

      - name: Prometheus metrics text
        run: curl -fsS "http://127.0.0.1:5200/metrics?format=prom" | head -n 20

      - name: Stop services
        if: always()
        run: |
          for f in book booking gateway; do
            if [[ -f "$GITHUB_WORKSPACE/.run/$f.pid" ]]; then
              kill "$(cat "$GITHUB_WORKSPACE/.run/$f.pid")" 2>/dev/null || true
            fi
          done
